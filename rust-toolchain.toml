# ALab systems build with the Trust toolchain (owner directive 2026-09-28).
# This file selects the compiler only; the lane is chosen on the command line:
# `targo --unverified <cmd>` (no proof claim) or `targo trust <cmd>` (verified).
# The earlier rationale for this pin lives in commit f2a257117 (git show f2a257117:rust-toolchain.toml).
[toolchain]
channel = "trust"
