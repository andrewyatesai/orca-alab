# Vendored, offline-by-construction dependency sources. Every third-party crate
# Orca uses is checked into rust/vendor (see docs/rust-migration/architecture.md
# "Dependency vendoring & stripping policy"). Builds resolve crates from there,
# never the network.
#
# No compiler flags live here. Verification policy belongs to the targo lane
# (`targo trust` / `targo --unverified`), which scopes it per unit; a `[host]`
# off-switch or `-Ztrust-*` rustflags table in this file makes `targo trust`
# refuse and `targo tippy` fail. The retired flag tables and their history are
# in commit f2a257117 (git show f2a257117:rust/.cargo/config.toml).
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[net]
offline = true
